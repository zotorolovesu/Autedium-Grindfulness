name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # for tag releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: build + test
        run: ./gradlew build --no-daemon

      - name: upload jar
        uses: actions/upload-artifact@v4
        with:
          name: autedium-grindfulness
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/libs/*[0-9].jar \
            --title "${GITHUB_REF_NAME}" --generate-notes || \
          gh release upload "${GITHUB_REF_NAME}" build/libs/*[0-9].jar --clobber
